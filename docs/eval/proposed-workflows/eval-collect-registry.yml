# PROPOSAL, NOT ACTIVE, NEVER RUN. Lives outside .github/workflows on purpose: moving it
# there (after Haris approves) makes it dispatchable.
#
# Collects tools/list from the REGISTRY-SELECTED third-party servers (docs/eval/SERVERS.md
# §Registry) in an ephemeral GitHub-hosted runner, never on a developer machine
# (Haris, 2026-11-12): their publishers are unknown.
#
# Hardening (each line cites its source in docs/eval/SERVERS.md §Ephemeral collection):
# - manual trigger only (workflow_dispatch); read-only token; no secrets referenced
# - npm_config_ignore_scripts=true: npm docs, ignore-scripts "If true, npm does not run
#   scripts specified in package.json files"; "environment variables that start with
#   npm_config_ will be interpreted as a configuration parameter". The npm docs do NOT say
#   whether this covers npx installs, so the collector also passes --ignore-scripts.
# - UV_NO_BUILD=1: uv docs, "If set, uv will not build source distributions" (building an
#   sdist runs its code); wheel-only packages are collected, others fail and are reported
# - proveflow's own guards still apply: tools/list only, method allowlist, job/process-group
#   kill, empty temp cwd, minimal env
#
# KNOWN GAP: `python -m proveflow.eval.collect` lands in step 4d. Until then this job fails.
name: eval-collect-registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      npm_config_ignore_scripts: "true"
      UV_NO_BUILD: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Collect tools/list (registry-selected servers only)
        # Node.js comes preinstalled on the ubuntu-24.04 image (actions/runner-images).
        run: >
          uv run python -m proveflow.eval.collect
          --servers data/eval/roles/registry_servers.json
          --yes --timeout 180 --ignore-scripts
          --out out/registry-tools.jsonl

      - name: Upload collected tool metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-tools
          path: out/registry-tools.jsonl
          retention-days: 7
          if-no-files-found: error
