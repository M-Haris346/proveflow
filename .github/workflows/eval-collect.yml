# Eval collection: MANUAL DISPATCH ONLY (Haris approved the move on 2026-11-12 and triggers
# it himself). Not run by Claude.
#
# Collects tools/list from ALL eval servers (reference, Playwright, Chrome DevTools, and the
# registry-selected ones; data/eval/roles/servers.json) in ONE ephemeral GitHub-hosted runner.
# Nothing third-party ever runs on a developer laptop. pg-mcp-guard is not collected here:
# it is Haris's own code, collected in-process by scripts/eval_pg_mcp_guard_list_tools.py.
#
# Hardening (sources in docs/eval/SERVERS.md §Ephemeral collection):
# - manual trigger only (workflow_dispatch); read-only token; no secrets referenced
# - --ignore-scripts / --no-build: the collector puts npm_config_ignore_scripts=true and
#   UV_NO_BUILD=1 into EVERY SERVER'S OWN env. They cannot be job-level variables: launched
#   servers get only proveflow's minimal env allow-list plus their configured env
#   (src/proveflow/introspect/env.py), so a job variable would never reach npx/uvx. A
#   job-level UV_NO_BUILD would also stop `uv sync` from building proveflow itself.
#     npm docs: ignore-scripts "If true, npm does not run scripts specified in package.json
#     files"; "environment variables that start with npm_config_ will be interpreted as a
#     configuration parameter" (they do not say whether npx honours it).
#     uv docs: UV_NO_BUILD "If set, uv will not build source distributions".
# - no step saves an Actions cache: setup-uv caching is off (below); the documented inputs of
#   actions/checkout v7.0.1 and actions/upload-artifact v7.0.2 (their READMEs) have no cache
#   setting; there is no actions/cache step. The artifact is an output only, and no workflow
#   downloads it automatically.
# - proveflow's own guards still apply: tools/list only, method allowlist, job/process-group
#   kill, empty temp cwd, minimal env
# - inputs (checkpoint 1c): `servers` picks the server file (default: the v1 set), `out_dir`
#   the output folder (v2: out/v2). They reach the shell ONLY as env vars (never `${{ }}`
#   inside a run script) and are checked against fixed patterns before use.
name: eval-collect

on:
  workflow_dispatch:
    inputs:
      servers:
        description: "Eval server file (data/eval/roles/<name>.json)"
        required: false
        default: "data/eval/roles/servers.json"
      out_dir:
        description: "Output folder: out or out/<name>"
        required: false
        default: "out"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          # setup-uv v10.3.3 README: enable-cache defaults to "auto" = "enabled on
          # GitHub-hosted runners except for release, tag push, pull_request_target, and
          # workflow_run events", so it would be ON for workflow_dispatch. Third-party code
          # runs in this job: it must not write a cache that CI later restores. The README
          # does not say whether enable-cache=false also covers saving/restoring, so all
          # three documented switches are off.
          enable-cache: "false"
          save-cache: "false"
          restore-cache: "false"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Validate inputs
        env:
          SERVERS: ${{ inputs.servers }}
          OUT_DIR: ${{ inputs.out_dir }}
        run: |
          [[ "$SERVERS" =~ ^data/eval/roles/[A-Za-z0-9_-]+\.json$ ]] || { echo "bad servers input"; exit 1; }
          [[ "$OUT_DIR" =~ ^out(/[A-Za-z0-9_-]+)?$ ]] || { echo "bad out_dir input"; exit 1; }
          test -f "$SERVERS" || { echo "servers file not found"; exit 1; }

      - name: Collect tools/list (all eval servers in the chosen server file)
        # Node.js comes preinstalled on the ubuntu-24.04 image (actions/runner-images).
        # Whether Chrome DevTools MCP needs a browser just to answer tools/list is not
        # documented; a failure is reported in the summary, not hidden.
        env:
          SERVERS: ${{ inputs.servers }}
          OUT_DIR: ${{ inputs.out_dir }}
        run: >
          uv run python -m proveflow.eval.collect
          --servers "$SERVERS"
          --yes --timeout 180 --ignore-scripts --no-build
          --out "$OUT_DIR/tools.jsonl"

      - name: Upload collected tool metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # inputs were validated above; `with:` values are not run by a shell
          name: eval-tools${{ inputs.out_dir != 'out' && '-v2' || '' }}
          path: |
            ${{ inputs.out_dir }}/tools.jsonl
            ${{ inputs.out_dir }}/tools.jsonl.summary.json
          retention-days: 7
          if-no-files-found: error
