# CI for ubuntu + windows. Skips MEASURED in run 45386319527 (head 0ce2abe, 1758 tests),
# printed by -rs:
#   ubuntu-24.04, 15 skipped: tests/safety/test_proxy_safety.py:320 (1, TerminateProcess + Job
#     Object); tests/safety/test_winjob.py:41, :66 (x3), :111 (6, Windows Job Object);
#     tests/unit/test_introspect_units.py:112 (x8), :119 (9, cmd.exe quoting). All Windows-only.
#   windows-2025, 2 skipped: tests/safety/test_proxy_safety.py:390 and :395 (POSIX signals).
# Re-measure from the run log whenever a test is added or removed; these are not computed.
# Actions are pinned by full commit SHA (tag in the comment, verified 2026-11-12 via the
# GitHub releases API); runner images are pinned to explicit labels from
# https://github.com/actions/runner-images (ubuntu-latest = 24.04, windows-latest = 2025).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # actions/checkout README (at the pinned SHA): fetch-depth "Number of commits to
          # fetch. 0 indicates all history for all branches and tags." Default: 1. Full history
          # is needed so test_v1_loader_reproduces_frozen_sha_and_v1_behaviour can load the
          # frozen v1 classifier from git 86157de (it skipped on the shallow checkout).
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Tests
        # -rs: print the reason for every skipped test, so CI shows exactly what did not run.
        run: uv run pytest --cov -rs
