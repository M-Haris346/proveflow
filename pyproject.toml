[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proveflow"
version = "0.0.1.dev0"
description = "Find, prove, fix, and verify cross-server toxic flows in your MCP tool setup"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Muhammad Haris" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.scripts]
proveflow = "proveflow.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proveflow"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "S",   # flake8-bandit
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is the point of tests

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["proveflow"]
