# proveflow scan gate (Phase 9). A STATIC (--no-launch) toxic-flow check for CI: it classifies
# from the config only (server names and command lines), never launches a server, and FAILS
# (exit 3) when a flow of the given class is found. See action/README.md for what it can and
# cannot see (it MISSES flows an introspected scan finds; measured in that README).
# Actions are pinned by full commit SHA, the same pins as .github/workflows/ci.yml.
name: proveflow scan gate
description: Fail CI when the MCP server config holds a toxic flow (static, --no-launch).
inputs:
  servers:
    description: Path to an MCP servers JSON file (mcpServers or servers shape), relative to the workspace.
    required: true
  fail-on:
    description: Flow class that fails the job - exfil, action, leak or any.
    required: false
    default: exfil
  sarif:
    description: Optional path (relative to the workspace) to also write SARIF 2.1.0.
    required: false
    default: ""
outputs:
  exit-code:
    description: proveflow's exit code - 0 clean, 1 error (incl. an unreadable config), 2 usage, 3 findings.
    value: ${{ steps.scan.outputs.exit-code }}
  flows:
    description: Number of flows in the report (empty when the scan could not report).
    value: ${{ steps.scan.outputs.flows }}
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: "3.12"
    - name: proveflow scan --no-launch --fail-on
      id: scan
      shell: bash
      # proveflow from THIS action's own repository and lock file (no index lookup of
      # "proveflow" at all, so no other package of that name can be picked up).
      working-directory: ${{ github.action_path }}/..
      env:
        SERVERS: ${{ inputs.servers }}
        FAIL_ON: ${{ inputs.fail-on }}
        SARIF: ${{ inputs.sarif }}
      run: |
        set +e
        abs() { case "$1" in /*|[A-Za-z]:*) printf '%s' "$1" ;; *) printf '%s/%s' "$GITHUB_WORKSPACE" "$1" ;; esac; }
        args=(--servers "$(abs "$SERVERS")" --no-launch --json --fail-on "$FAIL_ON" --project "$GITHUB_WORKSPACE")
        if [ -n "$SARIF" ]; then args+=(--sarif "$(abs "$SARIF")"); fi
        report="$RUNNER_TEMP/proveflow-scan.json"
        uv run --locked proveflow scan "${args[@]}" > "$report"
        code=$?
        flows=$(uv run --locked python -c "import json,sys; print(len(json.load(open(sys.argv[1], encoding='utf-8'))['flows']))" "$report" 2>/dev/null)
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "flows=$flows" >> "$GITHUB_OUTPUT"
        echo "proveflow scan exit $code, flows ${flows:-unknown} (static, --no-launch: THEORETICAL)"
        exit $code
